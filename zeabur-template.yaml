# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: EquiLens
spec:
  description: EquiLens single-instance Word workspace with persistent SQLite storage.
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Domain
      description: Zeabur subdomain for this deployment.
    - key: IMAGE_REF
      type: STRING
      name: Image
      description: Verified ghcr.io/alaala-daka/equilens image pinned to a full commit tag or digest.
  services:
    - name: equilens
      template: PREBUILT_V2
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          image: ${IMAGE_REF}
          runAsUserID: 1000
        ports:
          - id: web
            port: 3000
            type: HTTP
        volumes:
          - id: data
            dir: /data
        init:
          - id: data-permissions
            image: busybox:1.37.0
            volumes:
              - id: data
                mountPath: /data
            command:
              - /bin/sh
              - -c
              - chown 1000:1000 /data && chmod 700 /data
        env:
          DATABASE_PROVIDER:
            default: sqlite
          SQLITE_PATH:
            default: /data/equilens.sqlite
          APP_ORIGIN:
            default: ${ZEABUR_WEB_URL}
          PORT:
            default: "3000"
          HOSTNAME:
            default: 0.0.0.0
