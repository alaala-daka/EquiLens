# yaml-language-server: $schema=https://schema.zeabur.app/template.json
apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: EquiLens
spec:
  description: EquiLens single-instance Word workspace with persistent SQLite storage.
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Domain
      description: Zeabur subdomain for this deployment.
  services:
    - name: equilens
      template: PREBUILT_V2
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          image: ghcr.io/alaala-daka/equilens:sha-39a97b10ae33f23022fe805cdac5b64786cf8671
          runAsUserID: 1000
          command:
            - /bin/sh
            - -c
            - umask 077; exec node server.js
        ports:
          - id: web
            port: 3000
            type: HTTP
        volumes:
          - id: data
            dir: /data
        env:
          DATABASE_PROVIDER:
            default: sqlite
          SQLITE_PATH:
            default: /data/equilens/equilens.sqlite
          ANONYMOUS_DATA_RETENTION_DAYS:
            default: ""
          ANONYMOUS_DELETION_JOURNAL_DIR:
            default: /data/equilens/retention-journal
          # Optional ANONYMOUS_EMPTY_SESSION_RETENTION_DAYS must be omitted unless
          # a positive integer window is registered; an empty value fails readiness.
          APP_ORIGIN:
            default: ${ZEABUR_WEB_URL}
          PORT:
            default: "3000"
          HOSTNAME:
            default: 0.0.0.0
