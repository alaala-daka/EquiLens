services:
  app:
    image: ${EQUILENS_IMAGE:-equilens:local}
    build: .
    init: true
    environment:
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - SQLITE_PATH=/data/equilens.sqlite
      - APP_ORIGIN=${APP_ORIGIN:-http://127.0.0.1:3000}
      - ANONYMOUS_DATA_RETENTION_DAYS=${ANONYMOUS_DATA_RETENTION_DAYS:-}
      - ANONYMOUS_DELETION_JOURNAL_DIR=/data/retention-journal
      # Unset is omitted, not passed as an invalid empty string. No duration default.
      - ANONYMOUS_EMPTY_SESSION_RETENTION_DAYS
      - AI_BASE_URL=${AI_BASE_URL:-https://aigw.saurlax.com/v1}
      - AI_MODEL=${AI_MODEL:-glm-5.3-flash}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_REVIEW_MODE=${AI_REVIEW_MODE:-published}
      - AI_REVIEW_RETENTION_DAYS=${AI_REVIEW_RETENTION_DAYS:-}
      - AI_REVIEW_MAX_PROMPT_CHARS=${AI_REVIEW_MAX_PROMPT_CHARS:-}
      - AI_AGENT_MAX_CALLS=${AI_AGENT_MAX_CALLS:-25}
    volumes:
      - equilens-data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  equilens-data:
